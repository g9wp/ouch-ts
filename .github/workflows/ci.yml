name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-test tools
        run: sudo apt-get update && sudo apt-get install -y zip p7zip-full xz-utils brotli lz4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ouch

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm package
        run: deno task build

      - name: Format check
        run: deno fmt --check mod.ts mod_test.ts cross_test.ts build.ts deno.json

      - name: Type check
        run: deno task check

      - name: Test
        run: deno test -A
